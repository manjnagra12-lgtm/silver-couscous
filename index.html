<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Standard website setup: sets text encoding and fits phone screens -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Premier League Recall - Test your top 5 goalscorers knowledge by season.">
  <title>Premier League Recall | Top 5 Scorers</title>

  <!-- Makes Google/CDN connections faster so styles load quickly -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  
  <!-- Bootstrap 5: Gives us pre-made responsive grid and button styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Our own custom styles file -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- ==========================================
       TOP BAR: Game Title and Current Score/Strikes
       ========================================== -->
  <header class="py-3 sticky-top">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      
      <!-- Website Name -->
      <div class="d-flex align-items-center gap-2">
        <h1 class="h4 mb-0 fw-bold brand-text">Premier League Recall</h1>
        <span class="badge bg-secondary text-uppercase px-2 py-1 rounded-pill small fw-bold">Top 5</span>
      </div>

      <!-- Live Score Counters (JavaScript updates these numbers while you play) -->
      <div class="d-flex gap-2 align-items-center">
        <span class="badge bg-dark border border-secondary badge-status text-info" id="score-tracker">Score: 0</span>
        <span class="badge bg-dark border border-danger badge-status text-danger" id="strikes-tracker">Strikes: 0/3</span>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN SCREEN: Where the game happens
       ========================================== -->
  <main class="container my-auto py-4">
    
    <!-- Which season you are guessing (e.g. 2011-12) -->
    <section class="text-center mb-4">
      <h2 id="season-heading" class="display-4 fw-bold text-white mb-1">Loading...</h2>
      <p class="text-light-subtle mb-0">Can you name the top 5 goalscorers from this season?</p>
    </section>

    <!-- The Box Where You Type Your Answer -->
    <section class="row justify-content-center mb-4">
      <div class="col-12 col-md-8 col-lg-6">
        <form id="guess-form" class="card form-glass p-3 border-0" novalidate>
          <label for="player-guess" class="form-label text-light-subtle small fw-bold">
            Enter Player Surname or Full Name
          </label>
          
          <div class="input-group">
            <!-- Text input for typing a player name -->
            <input 
              type="text" 
              id="player-guess" 
              class="form-control form-control-lg form-control-custom" 
              placeholder="e.g., Henry, Shearer, Kane" 
              autocomplete="off"
              required>
            <!-- Submit button -->
            <button class="btn btn-action-submit px-4" type="submit" id="submit-btn">Submit</button>
          </div>
          
          <!-- Message text showing "Correct!", "Already guessed", or "Wrong" -->
          <div id="feedback-message" class="mt-2 small fw-medium" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <!-- The 5 Blank Cards (JavaScript creates the cards inside this div) -->
    <section aria-label="Top 5 Goal Scorers Board">
      <div class="row g-3 justify-content-center" id="slots-container"></div>
    </section>

    <!-- Bottom Buttons: Give up or go to the next round -->
    <section class="text-center mt-4">
      <!-- Clicking this gives up and shows whoever you missed -->
      <button id="give-up-btn" type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3 me-2">
        Reveal Remaining
      </button>
      
      <!-- This button appears only after the round finishes -->
      <button id="next-season-btn" type="button" class="btn btn-success fw-bold rounded-pill px-4 d-none">
        Next Season &rarr;
      </button>
    </section>
  </main>

  <!-- ==========================================
       FOOTER: Bottom copyright bar
       ========================================== -->
  <footer class="mt-auto py-3 bg-black text-center text-muted small border-top border-secondary">
    <div class="container">
      Premier League Recall &copy; 2026. Built with Vanilla JavaScript.
    </div>
  </footer>

  <!-- Link the two JavaScript files at the very bottom so HTML loads first -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
